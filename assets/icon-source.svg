<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo fuente del Habit Tracker.
  Diseño: cuadrado redondeado indigo (#6366f1) con la llama (Lucide flame)
  blanca centrada. La llama representa la racha = momentum, núcleo psicológico
  de la app.

  Cómo exportar a PNG (cuando vayas a publicar):
  1) Convierte a 1024×1024 PNG → reemplaza assets/images/icon.png
  2) Convierte a 512×512 PNG con 25% padding → reemplaza assets/images/splash-icon.png
  3) Convierte a 96×96 PNG → reemplaza assets/images/favicon.png
  4) Para el icono Android (adaptive):
     - foreground: la llama sola (sin el cuadrado), 1024×1024 PNG transparente
     - background: solo el color #6366f1, 1024×1024 PNG sólido
     - monochrome: la llama blanca sobre transparente, 1024×1024 PNG

  Herramientas para convertir:
  - https://cloudconvert.com/svg-to-png (online, rápido)
  - Figma / Sketch / Inkscape (export PNG)
  - npx svg-to-png (CLI)
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="230" ry="230" fill="#6366f1"/>
  <svg x="224" y="224" width="576" height="576" viewBox="0 0 24 24"
       fill="white" stroke="white" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
  </svg>
</svg>
